[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "velours-library"
version = "0.10.0"
description = "Local-first, provenance-aware offline knowledge library for the Velvet ecosystem"
requires-python = ">=3.8"
license = { file = "LICENSE" }
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
pdf = ["pypdf>=4,<6"]
dev = ["pytest>=7,<9"]

[project.urls]
Repository = "https://github.com/Velvet-ecosystem/velours_library"
Issues = "https://github.com/Velvet-ecosystem/velours_library/issues"

[project.scripts]
velour = "velours_library.cli:main"
velour-acquire = "velours_library.acquisition:main"
velour-pack-intake = "velours_library.pack_intake:main"
velour-pack-adopt = "velours_library.pack_adoption:main"
velour-pack-lifecycle = "velours_library.pack_lifecycle:main"
velour-provenance = "velours_library.source_provenance:main"
velour-serve = "velours_library.retrieval_service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
