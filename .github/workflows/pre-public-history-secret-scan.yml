name: Pre-public full history secret scan

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan full fetched Git history
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            ghcr.io/trufflesecurity/trufflehog:3.97.1 \
            git file:///work \
            --results=verified,unknown \
            --fail \
            --no-update \
            --github-actions
